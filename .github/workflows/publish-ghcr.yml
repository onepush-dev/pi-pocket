name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Dockerfile", "railway/**", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
env:
  UPSTREAM_SHA: cbb1eba6e99d0dbf2d7a16c68dabccfc05ca7a37
  VERSION: 0.29.0-beta.8
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TannerMidd/pi-pocket
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upstream image (docker/Dockerfile, unmodified)
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/pi-pocket-base:${{ env.VERSION }}
      - name: Railway layer
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: BASE=ghcr.io/onepush-dev/pi-pocket-base:${{ env.VERSION }}
          tags: ghcr.io/onepush-dev/pi-pocket:${{ env.VERSION }}
